name: Tests
on:
  pull_request:
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright pyyaml && playwright install --with-deps chromium
      - run: python3 build_site.py --local
      - run: python3 check_links.py
      - run: python3 check_site.py --fast
  octave:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y octave gnuplot
      - run: python3 mtest.py matlab/*.m
