<title>Signal Processing Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=JetBrains+Mono:wght@400;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<style>
/* Layout: lab notebook — a module rail on the left, one module at a time in a ~70ch reading column, demo panels break wider. */
:root {
  --paper: #F3F5F8; --panel: #FFFFFF; --ink: #16202A; --muted: #586674; --rule: #D3DAE2; --grid: #E4E9EE;
  --accent: #1F5FD1; --sig2: #C2366F; --sig3: #A86E05; --sig4: #0F7A63;
  --good: #1E7F4F; --bad: #B3261E; --accent-wash: #E6EEFB; --sig2-wash: #F9E7EF;
  --f-display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --f-body: "Source Serif 4", Georgia, "Times New Roman", serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --step--1: 0.84rem; --step-0: 1.02rem; --step-1: 1.22rem; --step-2: 1.5rem; --step-3: 2.05rem; --step-4: 2.8rem;
  --radius: 6px; --code-bg: #F7F9FB;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #0E1318; --panel: #151C23; --ink: #DCE3EA; --muted: #8E9BA8; --rule: #28333E; --grid: #1E2730;
  --accent: #7FA3FF; --sig2: #F07DAE; --sig3: #E3B04B; --sig4: #4CCFAE;
  --good: #5CC98E; --bad: #FF8A80; --accent-wash: #1A2540; --sig2-wash: #33182A; --code-bg: #10161C; color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #0E1318; --panel: #151C23; --ink: #DCE3EA; --muted: #8E9BA8; --rule: #28333E; --grid: #1E2730;
  --accent: #7FA3FF; --sig2: #F07DAE; --sig3: #E3B04B; --sig4: #4CCFAE;
  --good: #5CC98E; --bad: #FF8A80; --accent-wash: #1A2540; --sig2-wash: #33182A; --code-bg: #10161C; color-scheme: dark }

html { -webkit-text-size-adjust: 100%; }
body { background: var(--paper); color: var(--ink); font: 400 var(--step-0)/1.62 var(--f-body); }
a { color: var(--accent); text-underline-offset: 2px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { display: grid; grid-template-columns: 248px minmax(0, 1fr); min-height: 100vh; }
.rail { position: sticky; top: env(safe-area-inset-top, 0px); align-self: start; height: 100vh; overflow-y: auto;
  border-right: 1px solid var(--rule); padding: 22px 16px 32px; display: flex; flex-direction: column; gap: 18px; }
.brand { font: 700 1.05rem/1.15 var(--f-display); font-stretch: 78%; letter-spacing: 0.01em; text-transform: uppercase; color: var(--ink); text-decoration: none; }
.brand small { display: block; font: 400 var(--step--1)/1.3 var(--f-mono); text-transform: none; color: var(--muted); margin-top: 4px; letter-spacing: 0; }
.rail h4 { margin: 0 0 6px; font: 600 0.72rem/1 var(--f-display); letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.rail nav { display: flex; flex-direction: column; gap: 2px; }
.rail a.nav { display: grid; grid-template-columns: 2.2em 1fr; gap: 4px; padding: 6px 8px; border-radius: var(--radius); text-decoration: none; color: var(--ink); font: 500 0.9rem/1.3 var(--f-display); }
.rail a.nav .num { font: 600 0.78rem/1.6 var(--f-mono); color: var(--muted); }
.rail a.nav:hover { background: var(--grid); }
.rail a.nav[aria-current="page"] { background: var(--accent-wash); color: var(--accent); }
.rail a.nav[aria-current="page"] .num { color: var(--accent); }
.rail .soon { padding: 4px 8px; font: 400 0.85rem/1.45 var(--f-display); color: var(--muted); }
.rail a.xlink { display: block; text-decoration: none; border-radius: var(--radius); }
.rail a.xlink:hover { background: var(--grid); }
.rail a.xlink b { color: var(--accent); font-weight: 600; }

main { min-width: 0; padding-inline: clamp(16px, 4vw, 56px); padding-block: 28px 80px; }
.view { max-width: 980px; }
.view[hidden] { display: none !important; }

/* ---------- Shared lesson typography (modules use these classes) ---------- */
.module-head { border-bottom: 1px solid var(--rule); padding-bottom: 18px; margin-bottom: 22px; }
.eyebrow { font: 600 0.74rem/1 var(--f-mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; color: var(--ink); }
h1 { font-size: var(--step-4); font-weight: 750; font-stretch: 72%; line-height: 1.02; letter-spacing: -0.01em; margin: 10px 0 12px; }
h2 { font-size: var(--step-3); font-weight: 700; font-stretch: 80%; line-height: 1.1; margin: 56px 0 10px; }
h3 { font-size: var(--step-1); font-weight: 650; font-stretch: 90%; line-height: 1.25; margin: 30px 0 6px; }
h2 .sec { font: 600 0.9rem/1 var(--f-mono); color: var(--muted); margin-right: 10px; vertical-align: 0.35em; letter-spacing: 0; }
.lede { font-size: var(--step-1); line-height: 1.5; color: var(--ink); max-width: 64ch; margin: 0; }
.prose p, .prose li { max-width: 68ch; }
.prose ul, .prose ol { padding-left: 1.3em; }
.prose li + li { margin-top: 4px; }
.muted { color: var(--muted); }
code, .m { font-family: var(--f-mono); font-size: 0.88em; }
strong { font-weight: 600; }

/* Objectives / meta block */
.objectives { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px 28px; margin-top: 18px; }
.objectives > div { min-width: 0; }
.objectives h4 { margin: 0 0 6px; font: 600 0.72rem/1 var(--f-display); letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.objectives ul { margin: 0; padding-left: 1.1em; font-size: 0.95rem; }

/* Equations: monospace display block. Use <span class="v">x</span> for vectors (bold), <sub>, <sup>. */
.eq { font: 400 1rem/1.7 var(--f-mono); background: var(--panel); border: 1px solid var(--rule); border-radius: var(--radius);
  padding: 12px 16px; margin: 14px 0; overflow-x: auto; white-space: nowrap; }
.eq .note { font-family: var(--f-body); color: var(--muted); font-size: 0.9rem; white-space: normal; display: block; margin-top: 4px; }
.v { font-weight: 700; }
.mat { display: inline-grid; vertical-align: middle; border-left: 1.5px solid var(--ink); border-right: 1.5px solid var(--ink); border-radius: 3px; padding: 0 6px; gap: 0 12px; text-align: center; }

/* Demo panel: the interactive lab bench */
.demo { background: var(--panel); border: 1px solid var(--rule); border-radius: 10px; margin: 22px 0 28px; overflow: hidden; }
.demo-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; padding: 12px 16px; border-bottom: 1px solid var(--rule); }
.demo-head .tag { font: 600 0.7rem/1 var(--f-mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--panel); background: var(--accent); padding: 4px 7px; border-radius: 3px; }
.demo-head h3 { margin: 0; font-size: 1.05rem; }
.demo-body { display: grid; grid-template-columns: minmax(0, 1fr) 260px; }
.demo-body.stack { grid-template-columns: minmax(0, 1fr); }
.stage { min-width: 0; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.stage canvas { display: block; width: 100%; touch-action: none; }
.controls { border-left: 1px solid var(--rule); padding: 14px 16px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.demo-body.stack .controls { border-left: 0; border-top: 1px solid var(--rule); display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
.ctrl { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.ctrl label { font: 500 0.82rem/1.3 var(--f-display); display: flex; align-items: baseline; flex-wrap: wrap; color: var(--ink); }
.ctrl label > output, .ctrl label > .val { margin-left: auto; padding-left: 8px; }
.ctrl output, .ctrl .val { font: 600 0.8rem/1.3 var(--f-mono); color: var(--accent); font-variant-numeric: tabular-nums; }
.ctrl input[type=range] { width: 100%; accent-color: var(--accent); }
.ctrl select { font: 0.88rem var(--f-display); padding: 5px 6px; border: 1px solid var(--rule); border-radius: 4px; background: var(--paper); color: var(--ink); }
.btn { font: 600 0.82rem/1 var(--f-display); padding: 8px 12px; border-radius: 5px; border: 1px solid var(--accent); background: transparent; color: var(--accent); cursor: pointer; }
.btn:hover { background: var(--accent-wash); }
.btn.solid { background: var(--accent); color: var(--panel); }
.btn-row { display: flex; flex-wrap: wrap; gap: 8px; }
.check { display: flex; align-items: center; gap: 8px; font: 500 0.84rem var(--f-display); }
.check input { accent-color: var(--accent); }
.readout { font: 400 0.8rem/1.55 var(--f-mono); font-variant-numeric: tabular-nums; background: var(--paper); border: 1px solid var(--rule); border-radius: 5px; padding: 8px 10px; overflow-x: auto; }
.readout b { color: var(--accent); font-weight: 600; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font: 400 0.78rem/1.3 var(--f-mono); color: var(--muted); }
.legend i { display: inline-block; width: 14px; height: 3px; vertical-align: middle; margin-right: 6px; border-radius: 2px; }
.demo-foot { padding: 10px 16px 12px; border-top: 1px solid var(--rule); font-size: 0.9rem; color: var(--muted); }
.demo-foot strong { color: var(--ink); }

/* Callouts by role */
.callout { border-left: 3px solid var(--accent); background: var(--accent-wash); padding: 12px 16px; margin: 18px 0; border-radius: 0 var(--radius) var(--radius) 0; }
.callout > :first-child { margin-top: 0; } .callout > :last-child { margin-bottom: 0; }
.callout .label { display: block; font: 600 0.72rem/1 var(--f-display); letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 6px; color: var(--accent); }
.callout.us { border-color: var(--sig4); background: color-mix(in srgb, var(--sig4) 10%, var(--paper)); }
.callout.us .label { color: var(--sig4); }
.callout.pitfall { border-color: var(--sig2); background: var(--sig2-wash); }
.callout.pitfall .label { color: var(--sig2); }
.callout.intuit { border-color: var(--sig3); background: color-mix(in srgb, var(--sig3) 10%, var(--paper)); }
.callout.intuit .label { color: var(--sig3); }

/* Tables */
.tbl-wrap { overflow-x: auto; margin: 14px 0; border: 1px solid var(--rule); border-radius: var(--radius); }
table { border-collapse: collapse; width: 100%; font-size: 0.92rem; background: var(--panel); }
th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--rule); vertical-align: top; }
th { font: 600 0.76rem/1.3 var(--f-display); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); background: var(--paper); }
tr:last-child td { border-bottom: 0; }
td.num, th.num { text-align: right; font-family: var(--f-mono); font-variant-numeric: tabular-nums; }

/* Self-check */
.quiz { border: 1px solid var(--rule); border-radius: var(--radius); background: var(--panel); margin: 10px 0; }
.quiz summary { cursor: pointer; padding: 10px 14px; font: 500 0.98rem/1.45 var(--f-body); list-style: none; display: grid; grid-template-columns: 2em 1fr; }
.quiz summary::-webkit-details-marker { display: none; }
.quiz summary .q { font: 600 0.8rem/1.8 var(--f-mono); color: var(--accent); }
.quiz[open] summary { border-bottom: 1px solid var(--rule); }
.quiz .a { padding: 10px 14px 12px calc(14px + 2em); font-size: 0.95rem; }
.quiz .a > :first-child { margin-top: 0; } .quiz .a > :last-child { margin-bottom: 0; }

.refs { font-size: 0.92rem; }
.refs li { margin-bottom: 4px; }
.next { margin-top: 48px; padding-top: 18px; border-top: 1px solid var(--rule); display: flex; justify-content: space-between; flex-wrap: wrap; gap: 12px; font: 600 0.95rem var(--f-display); }


/* ---------- Expert rules of thumb ---------- */
.rules { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; margin: 16px 0 22px; counter-reset: rule; }
.rule { background: var(--panel); border: 1px solid var(--rule); border-radius: 8px; padding: 14px 16px 12px; display: grid; grid-template-columns: 2.6em minmax(0, 1fr); gap: 4px 12px; counter-increment: rule; }
.rule::before { content: counter(rule, decimal-leading-zero); grid-row: 1 / span 4; font: 600 0.8rem/1.9 var(--f-mono); color: var(--accent); }
.rule .say { font: 650 1.06rem/1.35 var(--f-display); font-stretch: 92%; color: var(--ink); text-wrap: balance; }
.rule .keynum { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 2px; }
.rule .keynum span { font: 600 0.76rem/1 var(--f-mono); padding: 5px 7px; border-radius: 4px; background: var(--accent-wash); color: var(--accent); font-variant-numeric: tabular-nums; }
.rule .why { font-size: 0.95rem; line-height: 1.55; min-width: 0; }
.rule .why > :first-child { margin-top: 2px; } .rule .why > :last-child { margin-bottom: 0; }
.rule .why .eq { margin: 8px 0; }
.rule .limits { font-size: 0.88rem; color: var(--muted); min-width: 0; }
.rule .limits::before { content: "Breaks when: "; font: 600 0.72rem/1 var(--f-display); letter-spacing: 0.1em; text-transform: uppercase; color: var(--sig2); }

/* ---------- MATLAB code blocks ---------- */
.rule-fig { margin: 8px 0 4px; max-width: 520px; } .rule-fig canvas { display: block; width: 100%; }
.prov { display: inline-block; font: 600 0.62rem/1 var(--f-mono); letter-spacing: 0.06em; text-transform: uppercase; padding: 3px 6px; border-radius: 3px; border: 1px solid currentColor; white-space: nowrap; vertical-align: middle; margin-left: 6px; background: transparent; }
.prov.exact { color: var(--good); } .prov.sim { color: var(--accent); } .prov.model { color: var(--sig3); } .prov.schem { color: var(--sig2); }
.prov-note { display: block; font: 400 0.78rem/1.35 var(--f-body); color: var(--muted); margin-top: 3px; }
.prov-legend { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; font-size: 0.86rem; background: var(--panel); border: 1px solid var(--rule); border-radius: 8px; padding: 10px 14px; margin: 14px 0; }
.prov-legend .prov { margin: 0 6px 0 0; }
.litfig { border: 1px solid var(--rule); border-radius: 8px; background: var(--panel); padding: 10px 14px; margin: 10px 0; }
.litfig img { max-width: 100%; height: auto; display: block; margin: 6px 0; }
.litfig .cite { font-size: 0.86rem; color: var(--muted); }
.stack-fig svg { width: 100%; height: auto; display: block; }

/* ---- Typeset equations (MathJax SVG). .eqn = display equation block; .key = worth memorizing ---- */
.eqn { position: relative; background: var(--panel); border: 1px solid var(--rule); border-radius: var(--radius); padding: 12px 16px 10px; margin: 16px 0; }
.eqn.key { border: 2px solid var(--accent); background: var(--accent-wash); }
.eqn.key::before { content: "Key equation"; position: absolute; top: -9px; left: 12px; font: 600 0.62rem/1 var(--f-mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); background: var(--paper); padding: 2px 6px; border-radius: 3px; }
.eqn .eqn-body { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 12px; }
.eqn .eqn-math { overflow-x: auto; overflow-y: hidden; font-size: 1.12rem; color: var(--ink); min-width: 0; }
.eqn .eqn-no { font: 600 0.8rem var(--f-mono); color: var(--muted); white-space: nowrap; }
.eqn .where { display: grid; grid-template-columns: max-content 1fr; gap: 3px 12px; margin: 10px 0 0; padding-top: 8px; border-top: 1px dashed var(--rule); font-size: 0.9rem; }
.eqn .where::before { content: "where"; grid-column: 1 / -1; font: 600 0.68rem/1 var(--f-display); letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.eqn .where dt { margin: 0; color: var(--ink); } .eqn .where dd { margin: 0; color: var(--muted); }
.eqn .note { display: block; font-family: var(--f-body); color: var(--muted); font-size: 0.9rem; margin-top: 6px; }
mjx-container { color: var(--ink); } mjx-container[display="true"] { margin: 0.3em 0 !important; }
@media (max-width: 600px) { .eqn .eqn-body { grid-template-columns: minmax(0, 1fr); gap: 2px; } .eqn .eqn-no { justify-self: end; } .eqn .eqn-math { font-size: 1rem; } }
.eqref { font-family: var(--f-mono); font-size: 0.86em; color: var(--accent); white-space: nowrap; }
mjx-container > mjx-assistive-mml { max-width: 1px !important; max-height: 1px !important; overflow: hidden !important; }
.eqn .where dt, .eqn .where dd { min-width: 0; overflow-wrap: anywhere; }
.eqn .where mjx-container, p mjx-container:not([display="true"]), li mjx-container:not([display="true"]), td mjx-container:not([display="true"]) { display: inline-block; max-width: 100%; overflow-x: auto; overflow-y: hidden; vertical-align: middle; }
details.code { border: 1px solid var(--rule); border-radius: 8px; background: var(--code-bg); margin: 12px 0; min-width: 0; }
details.code > summary { cursor: pointer; list-style: none; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 4px 12px; align-items: baseline; padding: 10px 14px; }
details.code > summary::-webkit-details-marker { display: none; }
details.code > summary::before { content: "▸"; font: 600 0.8rem var(--f-mono); color: var(--accent); }
details.code[open] > summary::before { content: "▾"; }
details.code .fname { font: 600 0.86rem/1.3 var(--f-mono); color: var(--ink); min-width: 0; overflow-wrap: anywhere; }
details.code .what { grid-column: 2 / span 2; font-size: 0.88rem; color: var(--muted); }
details.code .copy { font: 600 0.74rem/1 var(--f-display); padding: 6px 10px; border-radius: 4px; border: 1px solid var(--rule); background: var(--panel); color: var(--accent); cursor: pointer; }
details.code .copy:hover { border-color: var(--accent); }
details.code pre { margin: 0; border-top: 1px solid var(--rule); padding: 12px 14px; overflow-x: auto; font: 400 0.8rem/1.55 var(--f-mono); color: var(--ink); tab-size: 4; max-height: 70vh; }
details.code pre code { font: inherit; }
.tk-c { color: var(--muted); font-style: italic; } .tk-s { color: var(--sig4); } .tk-k { color: var(--accent); font-weight: 600; } .tk-n { color: var(--sig3); }
.code-note { font-size: 0.9rem; color: var(--muted); }

/* ---------- Numeric matrix display ---------- */
.mx-row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; margin: 8px 0; }
.mx-scroll { overflow-x: auto; max-width: 100%; }
.mx { display: inline-flex; align-items: stretch; gap: 0; font: 400 0.82rem/1.5 var(--f-mono); font-variant-numeric: tabular-nums; vertical-align: middle; }
.mx::before, .mx::after { content: ""; width: 6px; border: 1.5px solid var(--ink); }
.mx::before { border-right: 0; border-radius: 3px 0 0 3px; } .mx::after { border-left: 0; border-radius: 0 3px 3px 0; }
.mx table { border-collapse: collapse; width: auto; background: transparent; font: inherit; }
.mx td { padding: 1px 7px; border: 0; text-align: right; white-space: nowrap; }
.mx td.hl { background: var(--accent-wash); color: var(--accent); font-weight: 600; }
.mx td.hl2 { background: var(--sig2-wash); color: var(--sig2); font-weight: 600; }
.mx-cap { display: block; font: 600 0.72rem/1.4 var(--f-mono); color: var(--muted); text-align: center; margin-top: 2px; }
.mx-op { font: 600 1.1rem var(--f-mono); color: var(--muted); }
.mx-wrap { display: inline-flex; flex-direction: column; align-items: center; }

/* ---------- Hub ---------- */
.hub-hero { padding-block: 10px 6px; }
.hub-hero h1 { font-size: clamp(2.3rem, 6vw, 3.6rem); }
.map { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; margin-top: 18px; }
.tier { background: var(--panel); border: 1px solid var(--rule); border-radius: 10px; padding: 14px 16px; min-width: 0; }
.tier h3 { margin: 0 0 2px; }
.tier .sub { font: 400 0.82rem/1.35 var(--f-mono); color: var(--muted); margin: 0 0 10px; }
.tier ol { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; }
.tier li { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: baseline; font-size: 0.93rem; line-height: 1.35; }
.chip { font: 600 0.66rem/1 var(--f-mono); letter-spacing: 0.06em; text-transform: uppercase; padding: 4px 6px; border-radius: 3px; white-space: nowrap; }
.chip.live { background: var(--accent); color: var(--panel); }
.chip.queued { background: var(--grid); color: var(--muted); }
.chip.later { background: transparent; color: var(--muted); border: 1px dashed var(--rule); }
.tier li a { color: var(--ink); font-weight: 600; text-decoration-color: var(--accent); }
.pathline { font: 400 0.86rem/1.6 var(--f-mono); background: var(--panel); border: 1px solid var(--rule); border-radius: var(--radius); padding: 12px 14px; overflow-x: auto; white-space: pre; margin: 14px 0; }

@media (max-width: 860px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .rail { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; height: auto; flex-direction: row; align-items: center; overflow-x: auto; overflow-y: hidden; gap: 14px; padding: 10px 16px; border-right: 0; border-bottom: 1px solid var(--rule); background: var(--paper); }
  .rail .brand small, .rail h4, .rail .soon, .rail .grp-later { display: none; }
  .rail .grp { display: contents; }
  .rail nav { flex-direction: row; gap: 2px; }
  .rail a.nav { grid-template-columns: auto; white-space: nowrap; padding: 6px 8px; }
  .rail a.nav .t { display: none; }
  .demo-body { grid-template-columns: minmax(0, 1fr); }
  .controls { border-left: 0; border-top: 1px solid var(--rule); }
  h1 { font-size: var(--step-3); }

    x.beginPath(); pts.forEach((p, i) => i ? x.lineTo(p[0], p[1]) : x.moveTo(p[0], p[1])); x.strokeStyle = colr; x.lineWidth = o.w || 1.7; if (o.dash) x.setLineDash(o.dash); x.stroke(); x.restore(); }

  /* ---------- pair cards ---------- */
  function drawPair(cv, s, T) { const c = col(); const { x, w, h } = size(cv, 132); const gap = 30, bw = (w - gap) / 2 - 4;
    const L = { x: 2, y: 18, w: bw, h: h - 38 }, R = { x: 2 + bw + gap + 4, y: 18, w: bw, h: h - 38 };
    const ml = panel(x, L, s.tr, s.ty, { lab: s.tl || 'x(t)', ticks: s.tt ? s.tt(T) : [] });
    const mr = panel(x, R, s.fr, s.fy, { lab: s.fl || '|X(f)|', ticks: s.ft ? s.ft(T) : [] });
    s.time(x, ml, c, T); s.freq(x, mr, c, T);
    x.fillStyle = c.mu; x.font = '600 15px ' + c.mono; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText('↔', L.x + L.w + gap / 2 + 2, L.y + L.h / 2); }
  
  function drawPair(cv, s, T) { const c = col(); const { x, w, h } = size(cv, 132); const gap = 30, bw = (w - gap) / 2 - 4;
    const L = { x: 2, y: 18, w: bw, h: h - 38 }, R = { x: 2 + bw + gap + 4, y: 18, w: bw, h: h - 38 };
    const ml = panel(x, L, s.tr, s.ty, { lab: s.tl || 'x(t)', ticks: s.tt ? s.tt(T) : [] });
    const mr = panel(x, R, s.fr, s.fy, { lab: s.fl || '|X(f)|', ticks: s.ft ? s.ft(T) : [] });
    s.time(x, ml, c, T); s.freq(x, mr, c, T);
    x.fillStyle = c.mu; x.font = '600 15px ' + c.mono; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText(s.arrow || '↔', L.x + L.w + gap / 2 + 2, L.y + L.h / 2); }
  Lab.mini = { sinc, rect, tri, jinc, db, col, size, panel, curve, stems, text, pair: drawPair };
  Lab.cardGrid = function (viewId, gridId, specs, sliderId) {

    const T = () => sliderId ? +document.getElementById(sliderId).value : 1;

  };
